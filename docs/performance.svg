<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">First-field split benchmark</title>
  <desc id="desc">Line chart comparing split comma maxsplit one index zero and rust isplit first item as input size grows from 100 bytes to 1 megabyte.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="560" rx="28" fill="url(#bg)"/>
  <rect x="54" y="34" width="852" height="476" rx="22" fill="#ffffff" filter="url(#shadow)"/>

  <text x="100" y="86" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">
    First-field split benchmark
  </text>
  <text x="100" y="116" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">
    Median time in microseconds, CPython 3.12 on macOS arm64. Y axis uses a log scale.
  </text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#64748b">
    <line x1="100" y1="420" x2="860" y2="420" stroke="#cbd5e1"/>
    <line x1="100" y1="348.4" x2="860" y2="348.4" stroke="#e2e8f0"/>
    <line x1="100" y1="294.2" x2="860" y2="294.2" stroke="#e2e8f0"/>
    <line x1="100" y1="240" x2="860" y2="240" stroke="#e2e8f0"/>
    <line x1="100" y1="168.4" x2="860" y2="168.4" stroke="#e2e8f0"/>
    <line x1="100" y1="114.2" x2="860" y2="114.2" stroke="#e2e8f0"/>
    <line x1="100" y1="60" x2="860" y2="60" stroke="#e2e8f0"/>

    <text x="88" y="424" text-anchor="end">0.2</text>
    <text x="88" y="352.4" text-anchor="end">0.5</text>
    <text x="88" y="298.2" text-anchor="end">1</text>
    <text x="88" y="244" text-anchor="end">2</text>
    <text x="88" y="172.4" text-anchor="end">5</text>
    <text x="88" y="118.2" text-anchor="end">10</text>
    <text x="88" y="64" text-anchor="end">20 us</text>

    <line x1="100" y1="60" x2="100" y2="420" stroke="#cbd5e1"/>
    <text x="100" y="452" text-anchor="middle">100 B</text>
    <text x="290" y="452" text-anchor="middle">1 KB</text>
    <text x="480" y="452" text-anchor="middle">10 KB</text>
    <text x="670" y="452" text-anchor="middle">100 KB</text>
    <text x="860" y="452" text-anchor="middle">1 MB</text>
  </g>

  <polyline fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="100,402.5 290,380.2 480,342.1 670,236.8 860,94.9"/>
  <polyline fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="100,380.2 290,390.7 480,402.5 670,390.7 860,390.5"/>

  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="402.5" r="6"/>
    <circle cx="290" cy="380.2" r="6"/>
    <circle cx="480" cy="342.1" r="6"/>
    <circle cx="670" cy="236.8" r="6"/>
    <circle cx="860" cy="94.9" r="6"/>
  </g>
  <g fill="#10b981" stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="380.2" r="6"/>
    <circle cx="290" cy="390.7" r="6"/>
    <circle cx="480" cy="402.5" r="6"/>
    <circle cx="670" cy="390.7" r="6"/>
    <circle cx="860" cy="390.5" r="6"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">
    <text x="112" y="394" fill="#2563eb">0.25</text>
    <text x="302" y="372" fill="#2563eb">0.33</text>
    <text x="492" y="334" fill="#2563eb">0.54</text>
    <text x="682" y="229" fill="#2563eb">2.08</text>
    <text x="872" y="88" fill="#2563eb">12.79</text>

    <text x="112" y="374" fill="#10b981">0.33</text>
    <text x="302" y="407" fill="#10b981">0.29</text>
    <text x="492" y="419" fill="#10b981">0.25</text>
    <text x="682" y="407" fill="#10b981">0.29</text>
    <text x="798" y="407" fill="#10b981">0.29 us</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">
    <rect x="594" y="472" width="18" height="4" rx="2" fill="#2563eb"/>
    <text x="622" y="479" fill="#334155">split(",", 1)[0]</text>
    <rect x="744" y="472" width="18" height="4" rx="2" fill="#10b981"/>
    <text x="772" y="479" fill="#334155">next(isplit(...))</text>
  </g>
</svg>
