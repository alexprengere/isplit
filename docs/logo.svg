<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">isplit logo</title>
  <desc id="desc">A stylized string being split into lazy pieces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1040" height="360" rx="44" fill="url(#bg)"/>
  <circle cx="880" cy="58" r="128" fill="#38bdf8" opacity="0.12"/>
  <circle cx="142" cy="314" r="156" fill="#34d399" opacity="0.10"/>

  <g filter="url(#soft-shadow)">
    <rect x="86" y="114" width="868" height="132" rx="34" fill="#f8fafc" opacity="0.98"/>
    <path d="M146 180h178" stroke="#0f172a" stroke-width="22" stroke-linecap="round"/>
    <path d="M418 180h188" stroke="#0f172a" stroke-width="22" stroke-linecap="round"/>
    <path d="M700 180h194" stroke="#0f172a" stroke-width="22" stroke-linecap="round"/>

    <g fill="url(#accent)">
      <rect x="354" y="126" width="28" height="108" rx="14"/>
      <rect x="636" y="126" width="28" height="108" rx="14"/>
    </g>

    <g fill="#0f172a">
      <circle cx="368" cy="180" r="7"/>
      <circle cx="650" cy="180" r="7"/>
    </g>
  </g>

  <text x="520" y="320" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    isplit
  </text>
  <text x="520" y="74" text-anchor="middle" fill="#bae6fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="5">
    LAZY STRING SPLITTING
  </text>
</svg>
