repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: "321478e58f4938179c6b86e4ddfa923d1547a49b"  # frozen: v0.16.6
    hooks:
      - id: "ruff-check"
        args: ["--fix"]

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "4160603246a6b365d4a2af661c6d71b0a0f50478"  # frozen: 26.5.1
    hooks:
      - id: "black"

  - repo: "https://github.com/astral-sh/ty-pre-commit"
    rev: "166c7027240501d219155fe71ad9817f8d69237b"  # frozen: v0.0.80
    hooks:
      - id: "ty"
        args: ["--system-certs"]

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
    hooks:
      - id: "zizmor"
        args: ["--pedantic", "--no-progress"]
