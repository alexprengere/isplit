# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test, build and deploy Python packages

on:
  pull_request:
    paths-ignore:
    - 'README.md'
    - '.pre-commit-config.yaml'
  push:
    paths-ignore:
    - 'README.md'
    - '.pre-commit-config.yaml'
    branches:
    - main
    tags:
    - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "!startsWith(github.event.head_commit.message, '(skip-ci)')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: ${{ matrix.os }} - ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        working-directory: .
        version: "0.12.15"
        python-version: ${{ matrix.python-version }}
        enable-cache: false
    - name: Install tox and tox-uv
      run: uv tool install tox --with tox-uv
    - name: Run tox
      # Run tox using the version of Python in `PATH`
      run: tox --list-dependencies -e py -- -vv

  sdist:
    runs-on: ubuntu-latest
    needs: [test]
    name: Build source distribution
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        working-directory: .
        version: "0.12.9"
        enable-cache: false
    - name: Build source distribution
      run: uv build --sdist -o dist/
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-sdist
        path: dist

  wheels:
    runs-on: ${{ matrix.os }}
    needs: [test]
    name: Build wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          name: Linux
        - os: windows-latest
          name: Windows
        - os: macos-latest
          name: macOS
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build wheel
      uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
      with:
        maturin-version: v1.11.5
        manylinux: 2_28
        args: --release --locked --out dist --compatibility pypi
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.os }}
        path: dist

  dist_upload:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    needs: [sdist, wheels]
    name: PyPI upload
    environment: pypi
    permissions:
      id-token: write  # required for OIDC authentication
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1  # zizmor: ignore[unpinned-uses]
